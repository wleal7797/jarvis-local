[project]
name = "jarvis-local"
version = "0.1.0"
description = "Asistente de voz JARVIS 100 % local: Ollama, PostgreSQL + pgvector y voz offline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.4",
    "alembic>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "trafilatura>=2.0",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "psutil>=6.1",
    "faster-whisper>=1.1",
    # av 14+ quitó el parámetro `metadata_errors` que faster-whisper 1.2 todavía usa.
    "av>=12,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: necesita PostgreSQL corriendo (docker compose up -d)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migraciones generadas por Alembic: se dejan como las escribe la herramienta.
"migrations/versions/*" = ["E501"]
