<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{ app_name }}: asistente personal con IA 100 % local.">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="/static/img/jarvis.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
    try {
      const theme = localStorage.getItem("jarvis-theme");
      if (theme) document.documentElement.dataset.theme = theme;
    } catch (_) {}
  </script>
</head>
<body>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
